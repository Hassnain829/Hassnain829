<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Hassnain Ahmed — Software Engineer</title>
  <desc id="desc">A dark banner with Hassnain Ahmed's name, GitHub handle, and a floating three-dimensional H monogram. Laravel, Python, and applied AI are listed below the name.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b19"/>
      <stop offset=".52" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#140f30"/>
    </linearGradient>
    <radialGradient id="blue-aura">
      <stop offset="0" stop-color="#376aff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#376aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-aura">
      <stop offset="0" stop-color="#23e3d4" stop-opacity=".23"/>
      <stop offset="1" stop-color="#23e3d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".47" stop-color="#86e5f4"/>
      <stop offset="1" stop-color="#9387ff"/>
    </linearGradient>
    <linearGradient id="top-face" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#21718c"/>
      <stop offset=".42" stop-color="#123d70"/>
      <stop offset="1" stop-color="#3a277e"/>
    </linearGradient>
    <linearGradient id="middle-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f62"/>
      <stop offset="1" stop-color="#30215d"/>
    </linearGradient>
    <linearGradient id="left-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe3db"/>
      <stop offset="1" stop-color="#12518b"/>
    </linearGradient>
    <linearGradient id="right-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8778ff"/>
      <stop offset="1" stop-color="#292363"/>
    </linearGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ffff"/>
      <stop offset=".48" stop-color="#63ddeb"/>
      <stop offset="1" stop-color="#a18eff"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#8ca8df" opacity=".22"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="17" stdDeviation="16" flood-color="#020613" flood-opacity=".75"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="390" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="390" fill="url(#background)"/>
    <rect width="1280" height="390" fill="url(#dots)" opacity=".45"/>
    <ellipse cx="1010" cy="126" rx="450" ry="310" fill="url(#blue-aura)"/>
    <ellipse cx="785" cy="294" rx="370" ry="240" fill="url(#cyan-aura)"/>

    <g fill="none" stroke="#6ba5da" stroke-opacity=".13" stroke-width="1.2">
      <path d="M670 390 911 97M747 390 941 97M828 390 970 97M912 390 999 97M996 390 1028 97M1082 390 1058 97M1170 390 1087 97M1258 390 1116 97"/>
      <path d="M710 340h570M760 298h520M816 256h464"/>
    </g>
    <path d="M0 388h1280" stroke="#4ed9e3" stroke-opacity=".55" stroke-width="2"/>

    <g>
      <rect x="66" y="36" width="212" height="42" rx="21" fill="#102d45" stroke="#4ddedb" stroke-opacity=".65"/>
      <circle cx="88" cy="57" r="5" fill="#66e9db"/>
      <text x="107" y="64" fill="#d8f9ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing=".5">@Hassnain829</text>

      <text x="65" y="166" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="1">HASSNAIN</text>
      <text x="65" y="259" fill="url(#name-gradient)" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="2">AHMED</text>
      <rect x="70" y="281" width="404" height="3" rx="1.5" fill="url(#name-gradient)"/>
      <text x="70" y="323" fill="#f2f7ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="5">SOFTWARE ENGINEER</text>
      <text x="70" y="357" fill="#9ec9da" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="1.7">LARAVEL  ·  PYTHON  ·  APPLIED AI</text>
    </g>

    <g>
      <ellipse cx="969" cy="340" rx="237" ry="31" fill="#2c67dc" opacity=".39" filter="url(#blur)"/>
      <ellipse cx="970" cy="337" rx="193" ry="20" fill="#050b22" opacity=".58"/>

      <g fill="none" stroke-width="2">
        <path d="M725 165c21-89 153-140 261-132 104 8 214 82 225 170" stroke="#69d9e9" stroke-opacity=".27"/>
        <path d="M744 243c45 90 183 126 299 105 89-17 150-64 171-134" stroke="#a08aff" stroke-opacity=".27"/>
        <circle cx="729" cy="157" r="4" fill="#79e8e6" stroke="none"/>
        <circle cx="1209" cy="204" r="4" fill="#a593ff" stroke="none"/>
        <circle cx="790" cy="301" r="3" fill="#62cbff" stroke="none"/>
      </g>

      <g filter="url(#soft-shadow)">
        <!-- Three separated isometric slabs give the monogram physical depth. -->
        <path d="M775 222 980 302v22L775 244Z" fill="#123864"/>
        <path d="M980 302 1165 210v22L980 324Z" fill="#392b75"/>
        <path d="M960 130 1165 210 980 302 775 222Z" fill="#122b50" stroke="#5c79cd" stroke-width="2"/>
        <path d="M775 187 980 267v22L775 209Z" fill="#1c5b82"/>
        <path d="M980 267 1165 175v22L980 289Z" fill="#4b3a91"/>
        <path d="M960 95 1165 175 980 267 775 187Z" fill="url(#middle-face)" stroke="#6f9fda" stroke-width="2"/>
        <path d="M775 152 980 232v24L775 176Z" fill="url(#left-edge)"/>
        <path d="M980 232 1165 140v24L980 256Z" fill="url(#right-edge)"/>
        <path d="M960 60 1165 140 980 232 775 152Z" fill="url(#top-face)" stroke="#8ed6ef" stroke-width="2.5"/>
        <path d="M787 152 960 70 1152 141" fill="none" stroke="#d5ffff" stroke-opacity=".62" stroke-width="2"/>
        <path d="M775 176 980 256 1165 164" fill="none" stroke="#93e7f6" stroke-opacity=".43" stroke-width="2"/>

        <!-- The H lies on the sloped upper face, with a small offset as its bevel. -->
        <g transform="matrix(1.025 .4 -.925 .46 960 60)">
          <path d="M59 48h29v42h24V48h29v104h-29v-37H88v37H59Z" transform="translate(0 9)" fill="#071a31" opacity=".8"/>
          <path d="M59 48h29v42h24V48h29v104h-29v-37H88v37H59Z" fill="url(#monogram)" stroke="#e8ffff" stroke-opacity=".74" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="388" rx="21" fill="none" stroke="#7aa7d4" stroke-opacity=".36" stroke-width="2"/>
</svg>
